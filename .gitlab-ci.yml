default:
  image: public.ecr.aws/docker/library/python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --no-cache-dir uv==0.13.4
    - export TMPDIR="$CI_PROJECT_DIR/../.ci-tmp-$CI_JOB_ID"
    - mkdir -p "$TMPDIR"

stages:
  - dox
  - verify
  - security
  - synchronize

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: copy

dox:
  stage: dox
  before_script: []
  script:
    - python scripts/dox_lint.py . --recursive

verify:
  stage: verify
  tags:
    - arch:amd64
    - size:large
  timeout: 3 hours
  script:
    - apt-get install -y --no-install-recommends nodejs
    - uv sync --frozen --extra dev --extra security --extra cdk --extra agents --extra runtime-cpu
    - bash scripts/provision_qwen_cpu_tests.sh "$TMPDIR/qwen-cpu-tests"
    - source "$TMPDIR/qwen-cpu-tests/environment.sh"
    - uv run --frozen --no-sync python -m pytest -q tests
    - uv run --frozen --no-sync python scripts/verify_repository_governance.py --scan-tree --ref HEAD
    - uv run --frozen --no-sync ruff check src scripts infra tests

processing-bootstrap:
  stage: verify
  image: public.ecr.aws/docker/library/rust:1.90.0-alpine3.22@sha256:ee9b9f2ebd8741e4ecf1ade08918e492d642c4e625be481bb7b7954b89e9d504
  tags:
    - arch:amd64
    - size:large
  variables:
    RUST_TEST_THREADS: "1"
  before_script: []
  script:
    - export TMPDIR="$CI_PROJECT_DIR/../.processing-ci-$CI_JOB_ID"
    - export CARGO_TARGET_DIR="$TMPDIR/target"
    - mkdir -p "$TMPDIR"
    - rustup component add --toolchain 1.90.0 rustfmt
    - cd processing_bootstrap
    - uname -r
    - |
      kernel="$(uname -r)"
      case "$kernel" in
        [0-9]*.[0-9]*) ;;
        *) echo "Cannot read a kernel version from: $kernel"; exit 1 ;;
      esac
      kernel_major="${kernel%%.*}"
      kernel_minor="${kernel#*.}"
      kernel_minor="${kernel_minor%%[!0-9]*}"
      case "$kernel_major" in
        *[!0-9]*) echo "Cannot read a kernel version from: $kernel"; exit 1 ;;
      esac
      if [ "$kernel_major" -lt 5 ] || { [ "$kernel_major" -eq 5 ] && [ "$kernel_minor" -lt 13 ]; }; then
        echo "Runner kernel $kernel is older than 5.13: the initializer boundary tests need close_range and Landlock, so only the format check and both builds run here; the tests run in the public GitHub workflow."
        cargo fmt --all --check
        cargo build --release --locked --offline --target x86_64-unknown-linux-musl
        export CARGO_TARGET_DIR="$TMPDIR/native-target"
        cargo build --release --locked --offline --features sagemaker-native-v1 --target x86_64-unknown-linux-musl
        exit 0
      fi
    - cargo fmt --all --check
    - cargo test --workspace --locked --offline
    - cargo build --release --locked --offline --target x86_64-unknown-linux-musl
    - export CARGO_TARGET_DIR="$TMPDIR/native-target"
    - cargo test --workspace --locked --offline --features sagemaker-native-v1
    - cargo build --release --locked --offline --features sagemaker-native-v1 --target x86_64-unknown-linux-musl

bandit:
  stage: security
  script:
    - uv sync --frozen --extra security
    - uv run bandit -c pyproject.toml -r src scripts infra -lll

pip-audit:
  stage: security
  script:
    - uv sync --frozen --extra security
    - uv export --frozen --format requirements-txt --no-emit-project > "$TMPDIR/requirements.txt"
    - uv run pip-audit --disable-pip -r "$TMPDIR/requirements.txt" --strict
    - uv run --frozen --no-sync pip-audit -r scripts/qwen_cpu_test.requirements.lock --strict --disable-pip --vulnerability-service osv
    - uv run --frozen --no-sync pip-audit -r src/amlas/training/qwen_sft.requirements.lock --strict --disable-pip --vulnerability-service osv
    - uv run --frozen --no-sync python scripts/audit_pin_sets.py

detect-secrets:
  stage: security
  script:
    - uv sync --frozen --extra security
    - git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

sbom:
  stage: security
  script:
    - uv sync --frozen --extra security
    - uv export --frozen --format requirements-txt --no-emit-project > "$TMPDIR/requirements.txt"
    - uv run cyclonedx-py requirements "$TMPDIR/requirements.txt" --output-format JSON -o sbom.json
    - test -s sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 90 days

sync-main:
  stage: synchronize
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - git fetch --no-tags --depth=1 https://github.com/aws-samples/AMLAS--sample-ml-engineering-agent-swarm.git main:refs/remotes/github/main
    - python scripts/verify_repository_governance.py --compare-refs HEAD refs/remotes/github/main
