name: public-release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  processing-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/../amlas-processing-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch the pinned compiler image from the first source that answers
        run: |
          fetch_pinned_compiler_image() {
            for image in "$@"; do
              if docker pull --platform linux/amd64 "$image"; then
                echo "The pinned compiler image came from ${image%%/*}."
                echo "PINNED_COMPILER_IMAGE=$image" >> "$GITHUB_ENV"
                return 0
              fi
              echo "${image%%/*} did not deliver the pinned compiler image." >&2
            done
            echo "No source delivered the pinned compiler image." >&2
            return 1
          }
          fetch_pinned_compiler_image \
            public.ecr.aws/docker/library/rust:1.90.0-alpine3.22@sha256:ee9b9f2ebd8741e4ecf1ade08918e492d642c4e625be481bb7b7954b89e9d504 \
            docker.io/library/rust:1.90.0-alpine3.22@sha256:ee9b9f2ebd8741e4ecf1ade08918e492d642c4e625be481bb7b7954b89e9d504
      - name: Prepare the pinned compiler and formatter in workspace tmp
        run: |
          mkdir -p "$TMPDIR"
          docker run --rm --platform linux/amd64 \
            -v "$TMPDIR":/worktmp \
            "${PINNED_COMPILER_IMAGE:?}" sh -ec '
              mkdir -p /worktmp/rustup
              cp -a /usr/local/rustup/. /worktmp/rustup/
              export RUSTUP_HOME=/worktmp/rustup
              rustup component add --toolchain 1.90.0 rustfmt
            '
      - name: Check and build the static initializer without network access
        run: |
          docker run --rm --network none --platform linux/amd64 \
            --cap-drop SETPCAP --cap-drop NET_RAW --cap-drop MKNOD --cap-drop SETFCAP \
            --ulimit nofile=65536:65536 \
            -e RUST_TEST_THREADS=1 \
            -e TMPDIR=/worktmp -e CARGO_TARGET_DIR=/worktmp/target \
            -e RUSTUP_HOME=/worktmp/rustup \
            -v "$PWD":"/work:ro" -v "$TMPDIR":/worktmp \
            -w /work/processing_bootstrap \
            "${PINNED_COMPILER_IMAGE:?}" sh -ec '
              uname -r && cargo fmt --all --check
              cargo test --workspace --locked --offline
              cargo build --release --locked --offline --target x86_64-unknown-linux-musl
              export CARGO_TARGET_DIR=/worktmp/native-target
              cargo test --workspace --locked --offline --features sagemaker-native-v1
              cargo build --release --locked --offline --features sagemaker-native-v1 --target x86_64-unknown-linux-musl
            '
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TMPDIR: ${{ github.workspace }}/../amlas-public-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate recursive DOX coverage
        run: python scripts/dox_lint.py . --recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m pip install --no-cache-dir uv==0.13.4
      - run: uv sync --frozen --extra dev --extra security --extra cdk --extra agents --extra runtime-cpu
      - name: Provision real Qwen CPU test prerequisites
        run: |
          bash scripts/provision_qwen_cpu_tests.sh "$TMPDIR/qwen-cpu-tests"
          source "$TMPDIR/qwen-cpu-tests/environment.sh"
          printf 'PYTHONPATH=%s\nAMLAS_QWEN_TEST_METADATA=%s\nAMLAS_TEST_HUMANEVAL_PARQUET=%s\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nOMP_NUM_THREADS=1\n' "$PYTHONPATH" "$AMLAS_QWEN_TEST_METADATA" "${AMLAS_TEST_HUMANEVAL_PARQUET:?}" >> "$GITHUB_ENV"
      - run: uv run --frozen --no-sync python -m pytest -q tests
      - run: uv run --frozen --no-sync python scripts/verify_repository_governance.py --scan-tree --ref HEAD
      - run: uv run --frozen --no-sync ruff check src scripts infra tests
      - run: uv run --frozen --no-sync bandit -c pyproject.toml -r src scripts infra -lll
      - run: uv export --frozen --format requirements-txt --no-emit-project > "${RUNNER_TEMP}/requirements.txt"
      - run: uv run --frozen --no-sync pip-audit --disable-pip -r "${RUNNER_TEMP}/requirements.txt" --strict
      - run: uv run --frozen --no-sync pip-audit -r scripts/qwen_cpu_test.requirements.lock --strict --disable-pip --vulnerability-service osv
      - run: uv run --frozen --no-sync pip-audit -r src/amlas/training/qwen_sft.requirements.lock --strict --disable-pip --vulnerability-service osv
      - run: uv run --frozen --no-sync python scripts/audit_pin_sets.py
      - run: git ls-files -z | xargs -0 uv run --frozen --no-sync detect-secrets-hook --baseline .secrets.baseline
      - run: uv run --frozen --no-sync cyclonedx-py requirements "${RUNNER_TEMP}/requirements.txt" --output-format JSON -o sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyclonedx-sbom
          path: sbom.json
